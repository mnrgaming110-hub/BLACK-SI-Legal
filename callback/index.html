<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>BLACK SI | TikTok Connection</title>

    <style>
        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
        }

        .box {
            background: #161b22;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #ffffff;
        }

        p {
            color: #b0b0b0;
            line-height: 1.6;
        }

        a {
            color: #58a6ff;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>BLACK SI Media</h1>
        <h2 id="status">TikTok Connection</h2>

        <p id="message">
            This page is reserved for BLACK SI TikTok authorization.
        </p>

        <p>
            TikTok account authorization is not active yet.
            A secure backend is required to complete the connection.
        </p>

        <a href="../">Return to BLACK SI Media</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        if (params.has("error")) {
            document.getElementById("status").textContent =
                "TikTok Authorization Cancelled";

            document.getElementById("message").textContent =
                "TikTok authorization was not completed.";
        }

        if (params.has("code")) {
            document.getElementById("status").textContent =
                "TikTok Callback Received";

            document.getElementById("message").textContent =
                "Authorization callback received. Secure token exchange is not configured yet. Your account is not connected.";
        }

        if (window.location.search) {
            window.history.replaceState(null, "", window.location.pathname);
        }
    </script>
</body>
</html>
